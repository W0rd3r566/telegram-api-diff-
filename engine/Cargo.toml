[package]
name = "telegram-api-diff-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Rust core for tracking Telegram MTProto TL schema changes"
license = "MIT"

[lib]
name = "telegram_api_diff"
path = "src/lib.rs"

[dependencies]
serde_json = "1.0"
regex = "1.11"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
