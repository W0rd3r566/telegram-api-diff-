name: Track Telegram MTProto schema

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test Telegram message even when no schema changes are detected"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/track-schema.yml"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: telegram-schema-tracker
  cancel-in-progress: false

jobs:
  update-schema:
    name: Fetch and compare official schema
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch and compare schema
        id: track
        run: node src/index.js update

      - name: Notify Telegram about schema changes
        if: steps.track.outputs.has_changes == 'true' || inputs.test_notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADDED_COUNT: ${{ steps.track.outputs.added_count }}
          REMOVED_COUNT: ${{ steps.track.outputs.removed_count }}
          MODIFIED_COUNT: ${{ steps.track.outputs.modified_count }}
          METADATA_COUNT: ${{ steps.track.outputs.metadata_count }}
          PREVIOUS_LAYER: ${{ steps.track.outputs.previous_layer }}
          CURRENT_LAYER: ${{ steps.track.outputs.current_layer }}
          REPORT_URL: ${{ steps.track.outputs.report_url }}
          HAS_CHANGES: ${{ steps.track.outputs.has_changes }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Telegram secrets are missing. Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID."
            if [ "$TEST_NOTIFICATION" = "true" ]; then
              exit 1
            fi
            exit 0
          fi

          if [ "$TEST_NOTIFICATION" = "true" ] && [ "$HAS_CHANGES" != "true" ]; then
            message=$(printf '✅ LayerTracker test notification\nSchema check completed successfully; no changes detected.\nCurrent layer: %s\nReport: %s' "$CURRENT_LAYER" "$REPORT_URL")
          else
            message=$(printf 'Telegram MTProto schema changed\nLayer: %s -> %s\nAdded: %s\nRemoved: %s\nModified: %s\nMetadata changes: %s\nReport: %s' \
              "$PREVIOUS_LAYER" "$CURRENT_LAYER" "$ADDED_COUNT" "$REMOVED_COUNT" "$MODIFIED_COUNT" "$METADATA_COUNT" "$REPORT_URL")
          fi

          response=$(curl --fail-with-body --silent --show-error --request POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$message")

          printf '%s' "$response" | node -e '
            let body = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              try {
                const result = JSON.parse(body);
                console.log(result.ok ? "Telegram API accepted the message." : "Telegram API returned an error.");
                process.exitCode = result.ok ? 0 : 1;
              } catch {
                console.error("Telegram API returned invalid JSON.");
                process.exitCode = 1;
              }
            });
          '

      - name: Commit generated snapshots and reports
        run: |
          git add snapshots reports
          if git diff --cached --quiet; then
            echo "No snapshot or report changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Telegram MTProto schema snapshot"
          if ! git push; then
            echo "Branch advanced during the schema check; rebasing the generated commit."
            git pull --rebase origin main
            git push
          fi

      - name: Publish GitHub Release for schema changes
        if: steps.track.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_LAYER: ${{ steps.track.outputs.current_layer }}
        run: |
          tag="schema-$(date -u +%Y%m%d)-layer-$CURRENT_LAYER-$GITHUB_RUN_ID"
          cp reports/latest.md /tmp/schema-release-notes.md
          printf '\n---\n\nDashboard: https://w0rd3r566.github.io/telegram-api-diff-/\nLatest report: https://github.com/W0rd3r566/telegram-api-diff-/blob/main/reports/latest.md\n' >> /tmp/schema-release-notes.md
          gh release create "$tag" \
            --title "Telegram MTProto schema update: layer $CURRENT_LAYER" \
            --notes-file /tmp/schema-release-notes.md \
            --target "$(git rev-parse HEAD)"
