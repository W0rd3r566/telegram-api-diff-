name: Tests

on:
  push:
    branches: [main, rewrite/rust-js]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Node.js quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check site/app.js
          for file in src/*.js tests/*.js; do
            node --check "$file"
          done
