name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest

      - name: Compile Python
        run: python -m compileall -q src

      - name: Check dashboard JavaScript syntax
        run: |
          python -c "from pathlib import Path; import re; html = Path('site/index.html').read_text(encoding='utf-8'); scripts = re.findall(r'<script>(.*?)</script>', html, re.S); assert scripts, 'No inline JavaScript found'; Path('/tmp/telegram-api-diff-dashboard.js').write_text('\\n'.join(scripts), encoding='utf-8')"
          node --check /tmp/telegram-api-diff-dashboard.js
